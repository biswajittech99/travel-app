aviationstack:
  base-url: ${AVIATIONSTACK_BASE_URL:https://api.aviationstack.com/v1}
  api-key: ${AVIATIONSTACK_API_KEY}

serpapi:
  base-url: ${SERPAPI_BASE_URL:https://serpapi.com}
  api-key:  ${SERPAPI_API_KEY}




eureka:
  instance:
    prefer-ip-address: true
    lease-renewal-interval-in-seconds: 10
    lease-expiration-duration-in-seconds: 30
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
    registry-fetch-interval-seconds: 10

resilience4j:                       # ✅ FIX: root level not under amadeus
  retry:
    instances:
      supplierRetry:
        maxAttempts: 2
        waitDuration: 500ms
  circuitbreaker:
    instances:
      supplierCb:
        slidingWindowSize: 20
        failureRateThreshold: 50
        waitDurationInOpenState: 30s

logging:
  level:
    root: INFO
    com.example.searchservice: DEBUG
