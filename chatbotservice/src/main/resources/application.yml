server:
  port: 8081

spring:
  application:
    name: CHATBOTSERVICE

  autoconfigure:
    exclude:
      - org.springframework.ai.model.ollama.autoconfigure.OllamaChatAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiEmbeddingAutoConfiguration

  datasource:
    url: ${MYSQL_URL:jdbc:mysql://localhost:3306/travelapp}
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 20000
      idle-timeout: 300000
      max-lifetime: 1200000
      leak-detection-threshold: 30000

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    open-in-view: false
    database-platform: org.hibernate.dialect.MySQLDialect
    properties:
      hibernate:
        format_sql: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 2

  ai:

    openai:
      api-key: ${GROQ_API_KEY}
      base-url: ${GROQ_BASE_URL:https://api.groq.com/openai}

      chat:
        options:
          model: openai/gpt-oss-120b
          temperature: 0.7
          max-tokens: 2000

    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}

      embedding:
        model: nomic-embed-text



    vectorstore:
      qdrant:
        host: ${QDRANT_HOST:localhost}
        port: ${QDRANT_PORT:6334}
        collection-name: travel-knowledge
        initialize-schema: true

eureka:
  instance:
    prefer-ip-address: true
    lease-renewal-interval-in-seconds: 10
    lease-expiration-duration-in-seconds: 30

  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
    registry-fetch-interval-seconds: 30
    eureka-server-connect-timeout-seconds: 10
    eureka-server-read-timeout-seconds: 10

services:
  booking-url: ${BOOKING_SERVICE_URL:http://localhost:8087}
  user-url: ${USER_SERVICE_URL:http://localhost:8088}
  search-url: ${SEARCH_SERVICE_URL:http://localhost:8086}

chatbot:
  mode: spring-ai
  knowledge:
    ingestion:
      enabled: ${CHATBOT_KNOWLEDGE_INGESTION_ENABLED:false}
  cache:
    conversation-ttl: 3600
    booking-ttl: 300
    flight-ttl: 60

anthropic:
  api:
    key: UNUSED
    model: UNUSED
    max-tokens: 2000
