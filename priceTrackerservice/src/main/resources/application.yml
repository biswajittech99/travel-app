server:
  port: 9098
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}

spring:
  application:
    name: priceTrackerservice
  datasource:
    url: ${MYSQL_URL:jdbc:mysql://localhost:3306/travelapp}
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: create  # use update while testing
    properties:
      hibernate:
        format_sql: true

  kafka:
    bootstrap-servers: 9092

app:
  price:
    poll-ms: 300000



